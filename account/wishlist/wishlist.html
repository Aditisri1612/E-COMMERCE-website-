<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist | SHOPNOW</title>
  <link rel="stylesheet" href="wishlist.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    rel="stylesheet"
  />
</head>
<body>
  <!-- Header -->

  <header id="wishlist-header" class="text-center text-white py-3">
    <h1>My Wishlist</h1>
  </header>

  <!-- Wishlist Section -->
  <main class="container">
    <section id="wishlist-items">
      <!-- Wishlist Item Template -->
      <div class="wishlist-item">
        <img
          src=
          alt="O"
          class="item-image"
        />
        <div class="item-details"></div>
          <h2 class="item-name"></h2>
          <p class="item-price"></p>
        </div>
        <div class="item-actions">
          <button class="btn btn-primary move-to-cart">
            <i class="bi bi-cart"></i> Move to Cart
          </button>
          <button class="btn btn-danger remove-item">
            <i class="bi bi-trash"></i> Remove
          </button>
        </div>
      </div>
      <!-- Add more wishlist items dynamically -->
    </section>
    <div id="empty-message" class="text-center">Your wishlist is empty!</div>
  </main>

  <!-- Footer -->
  <footer id="wishlist-footer" class="text-center py-3">
    &copy;2024 SHOP NOW. All rights reserved.
  </footer>

  <script src="wishlist.js"></script>
</body>
</html>
